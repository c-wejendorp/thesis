num_classes: 35

spectrogram:
  sample_rate: 16000
  n_fft: 512

backbone:
  n_channels_ext: 128
  n_channels_int: 128
  kernel_size: 3
  dropout: 0.1
  causal: true
  n_blocks_pr_stack: 3
  dilation_base: 2
  n_stacks: 1
  residual_in_blocks: true
  residual_in_stacks: false
  use_custom_pw: true

noise:
  noise_mode: "std"
  noise_params: [0.00, 0.05, 0.1, 0.15, 0.20, 0.25]

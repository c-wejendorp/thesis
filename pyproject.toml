[project]
name = "thesis_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.1.1",
    "imageio-ffmpeg>=0.6.0",
    "ipykernel>=6.30.1",
    "ipympl>=0.9.8",
    "ipython>=9.6.0",
    "matplotlib>=3.10.6",
    "matplotlib-inline>=0.1.7",
    "numpy>=2.3.3",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "soundfile>=0.13.1",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchcodec>=0.7.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
